services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sutramind
      POSTGRES_USER: sutramind
      POSTGRES_PASSWORD: sutramind_local_only
    ports:
      - "5432:5432"
    volumes:
      - sutramind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sutramind -d sutramind"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./INFO:/INFO:ro
    environment:
      DATABASE_URL: postgresql+psycopg://sutramind:sutramind_local_only@db:5432/sutramind
      JWT_SECRET: sutramind-production-secret-change-me-later
      CORS_ORIGINS: http://localhost:5173,https://localhost:3000,https://sutramind.vercel.app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sutramind_pgdata:
